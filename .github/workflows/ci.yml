name: RouterGo CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: routergo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.20.1
  PNPM_VERSION: 11.19.0

jobs:
  quality:
    name: RouterGo / quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:lines
      - run: pnpm check:arch
      - run: pnpm check:secrets

  test:
    name: RouterGo / test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://routergo:routergo@localhost:5432/routergo
      REDIS_URL: redis://localhost:6380
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: routergo
          POSTGRES_USER: routergo
          POSTGRES_PASSWORD: routergo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routergo -d routergo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test

  build:
    name: RouterGo / build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  database:
    name: RouterGo / database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://routergo:routergo@localhost:5432/routergo
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: routergo
          POSTGRES_USER: routergo
          POSTGRES_PASSWORD: routergo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routergo -d routergo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Run seed twice and compare checksums
        shell: bash
        run: |
          set -euo pipefail
          first="$(pnpm db:seed)"
          second="$(pnpm db:seed)"
          printf '%s\n%s\n' "$first" "$second"
          first_checksum="$(sed -n 's/.*checksum=\([^ ]*\).*/\1/p' <<< "$first")"
          second_checksum="$(sed -n 's/.*checksum=\([^ ]*\).*/\1/p' <<< "$second")"
          test -n "$first_checksum"
          test "$first_checksum" = "$second_checksum"

  e2e:
    name: RouterGo / e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: routergo-playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
