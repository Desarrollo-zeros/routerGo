services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: routergo-pg
    environment:
      POSTGRES_DB: routergo
      POSTGRES_USER: routergo
      POSTGRES_PASSWORD: routergo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routergo"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: routergo-redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm@sha256:ebf2fc9bfcb186d34ddfd16bf4eb544e95bb8d3431aa616d39d9b16c73f54626
    container_name: routergo-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api/litellm.yaml.example:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-routergo-dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  pgdata:
  redisdata:
